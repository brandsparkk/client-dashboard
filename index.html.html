<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Progress Dashboard</title>
<style>
:root{--bg:#f2f7f7;--card:#fff;--tx:#0f2f38;--mu:#5f7c84;--bd:#d6e5e7;--ac:#0f8888;--dk:#0f4a59;--mint:#7fd1c0;--tr:#e3eef0;--ok:#f2745b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f25;--card:#11303a;--tx:#e8f4f4;--mu:#8fb0b6;--bd:#1f4651;--ac:#2fb3b0;--dk:#7fd1c0;--mint:#7fd1c0;--tr:#1b3c46;--ok:#f2745b}}
:root[data-theme="dark"]{--bg:#0b1f25;--card:#11303a;--tx:#e8f4f4;--mu:#8fb0b6;--bd:#1f4651;--ac:#2fb3b0;--dk:#7fd1c0;--mint:#7fd1c0;--tr:#1b3c46;--ok:#f2745b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px;color:var(--dk)}h2{font-size:16px;margin:0}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--dk);color:#fff;font:inherit;cursor:pointer}
button.g{background:none;color:var(--mu);padding:4px 8px;border:1px solid var(--bd);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0}
.big{font-size:40px;font-weight:700;color:var(--ac)}
.lg{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 14px;margin-bottom:14px}.lg img{display:block;height:44px;width:auto}
.card{border-top:3px solid var(--ac)}
h2{color:var(--dk)}
.bar{height:8px;background:var(--tr);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--mint));border-radius:99px;transition:width .2s}
.bar i.d{background:var(--ok)}
#add:hover,#addp:hover{background:var(--ac)}
.pl{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center;margin-top:10px;font-size:13px}
.pl b{text-align:right}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.item{margin-top:12px}.item .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 6px 4px 12px;border:1px solid var(--mint);border-radius:99px;background:var(--bg);font-size:13px}.chip button{padding:0 6px;background:none;color:var(--mu);font-size:16px;line-height:1}
.empty{color:var(--mu);text-align:center;padding:30px}
</style>
</head>

<h1>Client Progress Dashboard</h1>
<p class="sub">Track every project's completion (%) across all your clients.</p>
<div class="card"><div class="row"><input type="text" id="nm" placeholder="New client name…" maxlength="60"><button id="add">Add client</button></div>
<div class="row" style="margin-top:8px"><input type="text" id="pj" placeholder="New project (added to every client)…" maxlength="60"><button id="addp">Add project</button></div>
<div class="row" id="chips" style="margin-top:12px;gap:6px"></div></div>
<div class="sum">
<div class="card"><h2>Overall progress</h2><div class="big" id="ov">0%</div><div class="bar"><i id="ovb"></i></div><p class="sub" id="cnt" style="margin:8px 0 0"></p></div>
<div class="card"><h2>Average by project</h2><div class="pl" id="pp"></div></div>
</div>
<div class="clients" id="cl"></div>
</main>
<script>
const DEFAULTS=["Pink October","CSR Projects","Corporate Branding & Products","Content Posting","Competitions & Challenges","Events","Stakeholder Engagements","Employee Engagements","Social Media Management","Campaigns","Content & Digital Calendars","Client Meetings","CRM","Marketing Strategy (Thought Leadership)"];
const KEY="client-dash-v1";
let PROJECTS;
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.clients))S={clients:[{id:1,name:"Sample Client",p:{"Events":60,"Content Posting":85,"CRM":40}}]};
PROJECTS=Array.isArray(S.projects)&&S.projects.length?S.projects:[...DEFAULTS];S.projects=PROJECTS;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const val=(c,p)=>+c.p[p]||0;
const cp=c=>avg(PROJECTS.map(p=>val(c,p)));
function render(){
 const cs=S.clients;
 chips.innerHTML=PROJECTS.map((p,i)=>`<span class="chip">${esc(p)}<button data-rp="${i}" aria-label="Remove ${esc(p)}">×</button></span>`).join("");
 const all=avg(cs.map(cp));
 ov.textContent=all+"%";ovb.style.width=all+"%";
 cnt.textContent=cs.length+" client"+(cs.length==1?"":"s")+" · "+PROJECTS.length+" projects each";
 pp.innerHTML=PROJECTS.map(p=>{const a=avg(cs.map(c=>val(c,p)));return `<span>${esc(p)}</span><b>${a}%</b><div class="bar" style="grid-column:1/3"><i style="width:${a}%"></i></div>`}).join("");
 cl.innerHTML=cs.length?cs.map(c=>{const t=cp(c);return `<div class="card" data-id="${c.id}"><div class="ch"><h2>${esc(c.name)}</h2><button class="g" data-del>Remove</button></div>
 <div class="row" style="justify-content:space-between"><span class="sub" style="margin:0">Overall</span><b style="color:var(--ac)" data-tot>${t}%</b></div><div class="bar"><i data-totb style="width:${t}%"></i></div>`+
 PROJECTS.map((p,i)=>{const v=val(c,p);return `<div class="item"><div class="t"><span>${esc(p)}</span><b data-v="${i}">${v}%</b></div><div class="bar"><i class="${v==100?'d':''}" data-b="${i}" style="width:${v}%"></i></div><input type="range" min="0" max="100" step="5" value="${v}" data-i="${i}" aria-label="${esc(p)} progress"></div>`}).join("")+`</div>`}).join(""):`<div class="empty card">No clients yet. Add one above to start tracking.</div>`;
}
cl.addEventListener("input",e=>{
 const r=e.target;if(r.dataset.i===undefined)return;
 const card=r.closest(".card"),c=S.clients.find(x=>x.id==card.dataset.id),i=+r.dataset.i,v=+r.value;
 c.p[PROJECTS[i]]=v;
 card.querySelector(`[data-v="${i}"]`).textContent=v+"%";
 const b=card.querySelector(`[data-b="${i}"]`);b.style.width=v+"%";b.className=v==100?"d":"";
 const t=cp(c);card.querySelector("[data-tot]").textContent=t+"%";card.querySelector("[data-totb]").style.width=t+"%";
 save();
});
cl.addEventListener("change",e=>{if(e.target.dataset.i!==undefined)render()});
cl.addEventListener("click",e=>{
 if(e.target.dataset.del===undefined)return;
 const id=e.target.closest(".card").dataset.id,c=S.clients.find(x=>x.id==id);
 if(confirm("Remove "+c.name+"?")){S.clients=S.clients.filter(x=>x.id!=id);save();render()}
});
function addClient(){
 const n=nm.value.trim();if(!n)return;
 S.clients.push({id:Date.now(),name:n,p:{}});nm.value="";save();render();
}
function addProject(){
 const n=pj.value.trim();if(!n)return;
 if(PROJECTS.some(p=>p.toLowerCase()===n.toLowerCase())){alert("That project already exists.");return}
 PROJECTS.push(n);pj.value="";save();render();
}
chips.addEventListener("click",e=>{
 const i=e.target.dataset.rp;if(i===undefined)return;
 if(PROJECTS.length<2){alert("Keep at least one project.");return}
 if(confirm('Remove "'+PROJECTS[i]+'" from every client?')){PROJECTS.splice(+i,1);save();render()}
});
addp.onclick=addProject;
pj.addEventListener("keydown",e=>{if(e.key==="Enter")addProject()});
add.onclick=addClient;
nm.addEventListener("keydown",e=>{if(e.key==="Enter")addClient()});
render();
</script>
</body>
</html>
